name: Snapshot

# Captures market state hourly to the `data` branch.
#
# The upstream API exposes the order book only as it stands right now, so spread,
# depth and balances over time are unrecoverable after the fact — this is the
# only way that history ever comes to exist. See SPEC.md §1.5.

on:
  schedule:
    # On the hour, by request. Note that GitHub treats schedules as best
    # effort and :00 is its most contended slot, so actual start times will
    # drift — often by more than an offset minute would have. Every snapshot
    # records the time it really ran in `capturedAt`, and consumers read that
    # rather than assuming the slot, so drift costs accuracy of labelling,
    # never correctness of data.
    - cron: "0 * * * *"
  workflow_dispatch:

# Runs must not overlap — two jobs pushing to `data` would race.
concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Resolved once at job level: `secrets` is unavailable in step-level `if`.
    env:
      HAS_TOKEN: ${{ secrets.DATA_PUSH_TOKEN != '' }}

    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # DATA_PUSH_TOKEN, when present, attributes these commits to a real
      # account instead of the Actions bot. That is what keeps the schedule
      # alive — see the keep-alive workflow and README "Keeping the capture
      # running". Falls back to GITHUB_TOKEN so a fresh clone still works.
      - name: Check out the data branch
        env:
          REMOTE: https://x-access-token:${{ secrets.DATA_PUSH_TOKEN || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          DAY="$(date -u +%Y-%m-%d)"
          # The capture stamps its own day from its own clock, minutes after
          # this one — see the sparse-checkout note below.
          NEXT_DAY="$(date -u -d '+1 day' +%Y-%m-%d)"

          # `git ls-remote --exit-code` answers three different things, and a
          # plain `if` treats two of them as "no branch": 0 the branch exists,
          # 2 the repo is reachable and the branch is not there, 128 the repo
          # could not be reached at all — an expired DATA_PUSH_TOKEN, a DNS
          # blip, GitHub having a moment. Taking the 128 path would `git init`
          # a fresh orphan branch, sweep the roster cold, and try to push a
          # one-row history over the real one. Only the non-forced push stops
          # that from replacing the entire dataset, which is far too thin a
          # margin. Verified exit codes against git 2.49.
          set +e
          git ls-remote --exit-code --heads "$REMOTE" data >/dev/null 2>&1
          ls_remote_status=$?
          set -e
          if [ "$ls_remote_status" -ne 0 ] && [ "$ls_remote_status" -ne 2 ]; then
            echo "::error::Could not reach the repository to look for the data branch (git ls-remote exit $ls_remote_status). Refusing to start a replacement history — check DATA_PUSH_TOKEN has not expired."
            exit 1
          fi

          if [ "$ls_remote_status" -eq 0 ]; then
            # Partial clone plus a sparse checkout: the branch accumulates
            # indefinitely and a full clone would download every snapshot ever
            # taken. This fetches the commit graph without blobs, then
            # materialises only the root files and today's folder.
            #
            # The cost that remains grows with the branch's age: no blobs, but
            # the whole commit graph, and this pushes 24 commits a day forever.
            # At a few thousand commits that is seconds; it is worth watching
            # against `timeout-minutes` over years, not now.
            #
            # `--depth=1` would make it constant. An earlier version of this
            # comment claimed shallow clones cannot push, which is not true —
            # verified locally against git 2.49, a depth-1 clone commits and
            # pushes fine. It is left alone deliberately: that test was against
            # a file:// remote, and GitHub's receive path can reject shallow
            # updates in ways a local remote does not, which would break the
            # capture outright. Validate against the real remote before
            # adopting it.
            git clone --filter=blob:none --no-checkout --single-branch --branch data "$REMOTE" data-branch
            cd data-branch
            git sparse-checkout init --cone
            # `series` must be materialised too, not just today's snapshots:
            # the day's series file is appended to on every run, so a missing
            # working copy would be read as empty and the whole day's
            # accumulated rows overwritten with a single one. Cone mode adds
            # root files (latest.json, roster.json) automatically.
            #
            # Tomorrow's folder is materialised as well, because `$DAY` and the
            # capture's own day key come from two clocks read minutes apart: this
            # step runs before the clone and the Node setup, the script stamps
            # `capturedAt` when it starts. A run beginning at 23:59Z writes into
            # tomorrow, and a path outside the cone makes `git add -A` exit 1 —
            # which, under `set -e`, aborts the commit and loses the hour
            # entirely, snapshot and series row alike. The directory usually does
            # not exist on the branch yet; naming it anyway is free.
            git sparse-checkout set "snapshots/$DAY" "snapshots/$NEXT_DAY" series
            git checkout data
          else
            echo "No data branch yet — creating it."
            mkdir data-branch
            cd data-branch
            git init -q -b data
            git remote add origin "$REMOTE"
          fi

      # Exit 2 means "written, but some endpoint failed after retries". The
      # partial hour is still worth committing — it is the only record of this
      # moment that will ever exist — so the failure is carried past the push
      # and raised at the end instead of aborting here. Any other non-zero code
      # means nothing usable was written, and fails the job immediately.
      - name: Capture
        id: capture
        run: |
          set +e
          node scripts/snapshot.mjs --out data-branch
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
          echo "degraded=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        working-directory: data-branch
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$HAS_TOKEN" = "true" ]; then
            git config user.name "$OWNER"
            git config user.email "$OWNER@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing captured — not committing."
            exit 0
          fi
          git commit -q -m "snapshot: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin data
          echo "Pushed $(git rev-parse --short HEAD)."

      # Raised after the push, so the incomplete capture is preserved and the
      # run is still visibly red. Runs even if the push failed, so a degraded
      # capture is never hidden behind an earlier failure.
      - name: Fail a degraded capture
        if: always() && steps.capture.outputs.degraded == 'true'
        run: |
          echo "::error::Capture was incomplete — one or more endpoints failed after retries. The snapshot's meta.errors lists them; affected series columns are null."
          exit 1
