name: Snapshot

# Captures market state hourly to the `data` branch.
#
# The upstream API exposes the order book only as it stands right now, so spread,
# depth and balances over time are unrecoverable after the fact — this is the
# only way that history ever comes to exist. See SPEC.md §1.5.

on:
  schedule:
    # On the hour, by request. Note that GitHub treats schedules as best
    # effort and :00 is its most contended slot, so actual start times will
    # drift — often by more than an offset minute would have. Every snapshot
    # records the time it really ran in `capturedAt`, and consumers read that
    # rather than assuming the slot, so drift costs accuracy of labelling,
    # never correctness of data.
    - cron: "0 * * * *"
  workflow_dispatch:

# Runs must not overlap — two jobs pushing to `data` would race.
concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Resolved once at job level: `secrets` is unavailable in step-level `if`.
    env:
      HAS_TOKEN: ${{ secrets.DATA_PUSH_TOKEN != '' }}

    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # DATA_PUSH_TOKEN, when present, attributes these commits to a real
      # account instead of the Actions bot. That is what keeps the schedule
      # alive — see the keep-alive workflow and README "Keeping the capture
      # running". Falls back to GITHUB_TOKEN so a fresh clone still works.
      - name: Check out the data branch
        env:
          REMOTE: https://x-access-token:${{ secrets.DATA_PUSH_TOKEN || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          DAY="$(date -u +%Y-%m-%d)"
          # The capture stamps its own day from its own clock, minutes after
          # this one — see the sparse-checkout note below.
          NEXT_DAY="$(date -u -d '+1 day' +%Y-%m-%d)"

          if git ls-remote --exit-code --heads "$REMOTE" data >/dev/null 2>&1; then
            # Partial clone plus a sparse checkout: the branch accumulates
            # indefinitely, and neither a full clone nor a shallow one is
            # workable — shallow clones can't push, full clones would download
            # every snapshot ever taken. This fetches the commit graph without
            # blobs, then materialises only the root files and today's folder.
            git clone --filter=blob:none --no-checkout --single-branch --branch data "$REMOTE" data-branch
            cd data-branch
            git sparse-checkout init --cone
            # `series` must be materialised too, not just today's snapshots:
            # the day's series file is appended to on every run, so a missing
            # working copy would be read as empty and the whole day's
            # accumulated rows overwritten with a single one. Cone mode adds
            # root files (latest.json, roster.json) automatically.
            #
            # Tomorrow's folder is materialised as well, because `$DAY` and the
            # capture's own day key come from two clocks read minutes apart: this
            # step runs before the clone and the Node setup, the script stamps
            # `capturedAt` when it starts. A run beginning at 23:59Z writes into
            # tomorrow, and a path outside the cone makes `git add -A` exit 1 —
            # which, under `set -e`, aborts the commit and loses the hour
            # entirely, snapshot and series row alike. The directory usually does
            # not exist on the branch yet; naming it anyway is free.
            git sparse-checkout set "snapshots/$DAY" "snapshots/$NEXT_DAY" series
            git checkout data
          else
            echo "No data branch yet — creating it."
            mkdir data-branch
            cd data-branch
            git init -q -b data
            git remote add origin "$REMOTE"
          fi

      - name: Capture
        run: node scripts/snapshot.mjs --out data-branch

      - name: Commit and push
        working-directory: data-branch
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$HAS_TOKEN" = "true" ]; then
            git config user.name "$OWNER"
            git config user.email "$OWNER@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing captured — not committing."
            exit 0
          fi
          git commit -q -m "snapshot: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin data
          echo "Pushed $(git rev-parse --short HEAD)."
